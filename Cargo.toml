[package]
name = "maquette"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Generates armatures for anime-style characters as SVG with named landmarks"
license = "MIT"
repository = "https://github.com/joeloverbeck/maquette"
publish = false

[dependencies]
# VectorCraft's MCP server speaks JSON: the read-back writes its requests and reads its
# replies and recordings of them with this.
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Reads every text file a person edits or a consumer reads back: the list of proportions,
# a set of proportions, a landmark file and the record of the hand-made views.
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# The tests read the written SVG with a parser the generator does not share.
roxmltree = "0.21"

# Its own stand-in for VectorCraft's server, so it has no test harness: see the file.
[[test]]
name = "vectorcraft_stand_in"
harness = false

# A whole set of proportions made from a proportion table, by `maquette set-from-table`: the
# table's middle values where it has a range, the average of the characters where two to four give
# a proportion, and another set's own numbers for the rest. [sources] says which each is.
#
# It is one head to be drawn and looked at. It is no proportion table and no part of one, and
# what it borrows is not measured on any reference. `maquette draw` reads this file as it
# reads any set of proportions, and `maquette list-proportions` defines each proportion.

[source]
table = "built from the records of Jon's checks at Look 4 of 8, checked on 2026-11-17, and at Look 7 of 8, checked on 2026-11-18"
borrowed_from = "data/saffi/proportions.toml"
from_the_table = 48
thin_averages = 6
borrowed = 26
left_out = 6
correction = "The set carries no correction. Run on this set's own depths, the list's rule for `lower_face_set_back` would set the chin back by 0.0688 of a unit at a share of 1, and the mouth by 0.0. That is not carried."

[rules]
the_table = "A proportion with a valid range takes the table's middle value: the median of the characters that give it."
a_thin_average = "A proportion that two to four characters give takes the average of those characters, and is marked as thin: it has no range. It is the average and not the middle, because the middle of three characters is one character's own number."
borrowed = "Every other proportion is borrowed from the set named as `borrowed_from`, as it stands there unless the rule `hangs_on` places it: one that a single character gives, since that is one reference's number; one that no character gives; and a convention, which is never measured."
taken_whole = "An ear and the neck are each taken whole. An ear is one form built on its two base points, and the neck one column: its width, where it ends and how far back it stands belong together, and a width from one source on a depth from another sets the head forward on a post. So unless the table and the thin averages give every one of a form's proportions, all of them are borrowed."
hangs_on = "A borrowed point that hangs on a measured one keeps its offset from it. The jaw point hangs on the chin: it is borrowed as how far the borrowed set's jaw point stands from that set's own chin, in height, in half-width and in depth, and is placed from this set's chin. Every chin is one unit below the eye line and on the centre line, so the jaw point's height and half-width come over as they stand; its depth is this set's chin's depth plus the borrowed offset. Without this a jaw point borrowed as it stands is set in front of or behind a chin that was measured elsewhere, and the chin of a turned view is lopsided."
no_correction = "The set carries no correction, whatever the set it borrows from carries. A correction's amounts are worked out from a set's own depths, and whether a head is drawn with one is Jon's to say."


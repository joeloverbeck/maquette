# A whole set of proportions made from a proportion table, by `maquette set-from-table`: the
# table's middle values where it has a range, the average of the works where two to four give
# a proportion, and another set's own numbers for the rest. [sources] says which each is.
#
# It is one head to be drawn and looked at. It is no proportion table and no part of one, and
# what it borrows is not measured on any reference. `maquette draw` reads this file as it
# reads any set of proportions, and `maquette list-proportions` defines each proportion.

[source]
table = "built from the record of Jon's check at Look 4 of 8, checked on 2026-11-17"
borrowed_from = "data/saffi/proportions.toml"
from_the_table = 27
thin_averages = 17
borrowed = 29
correction = "The set carries no correction. Run on this set's own depths, the list's rule for `lower_face_set_back` would set the chin back by 0.01155 of a unit at a share of 1, and the mouth by 0.0. That is not carried."

[rules]
the_table = "A proportion with a valid range takes the table's middle value: the median of the works that give it."
a_thin_average = "A proportion that two to four works give takes the average of those works, and is marked as thin: it has no range. It is the average and not the middle, because the middle of three works is one work's own number."
borrowed = "Every other proportion is borrowed, as it stands, from the set named as `borrowed_from`: one that a single work gives, since that is one reference's number; one that no work gives; and a convention, which is never measured."
taken_whole = "An ear is taken whole. It is one form built on its two base points, so unless the table and the thin averages give every one of its proportions, all of them are borrowed."
no_correction = "The set carries no correction, whatever the set it borrows from carries. A correction's amounts are worked out from a set's own depths, and whether a head is drawn with one is Jon's to say."


<?xml version="1.0" encoding="UTF-8"?>
<!-- Probe 7b, hand-written: size in px at twice the viewBox, and a viewBox that does not start at 0 0. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="50 25 200 100" fill="none" stroke="#2a2f3d" stroke-width="1">
  <line id="unit-line" x1="60" y1="45" x2="160" y2="45"/>
</svg>

# The known positions of `side-profile.png`, written as a landmark file is, so that
# `maquette score-reading --known-positions` reads them.
#
# The drawing is an original head made for this test on 2026-11-17, in VectorCraft
# (`side-profile.vectorcraft`): a painted woman's head in profile, facing the viewer's right. It
# is no character and copies no drawing. Its picture is a render at one pixel to a unit.
#
# Every position below is an anchor of a drawn path, or a crossing worked out on a straight
# segment; README.md beside this file says which, landmark by landmark, by the definitions of
# revision 2026-11-17.4 of the reading instructions. Names are a reader's, but for the back edge of
# the jaw, which a reader places under `face-outline-right-at-...` and the list calls the jaw line.
# A shoulder point is not given: the profile's shoulder is under the garment, and a reader may
# state it as not seen or place it; either way it is not scored.

view = "side"
svg = "side-profile.svg"
what = "an original painted head in profile drawn in VectorCraft for the retest of revision 2026-11-17.4, design/side-view-retest/side-profile.png, whose positions are the anchors of its paths"
turn_degrees = 90.0

[frame]
width = 1000.0
height = 1000.0
unit = 230.0  # eye line to chin
head_height = 475.0  # hair top to chin
eye_line_y = 450.0

[landmarks]

# Saffi's hand-made views compared: the turn of the three-quarter view, and where the two
# views do not describe one head.
#
# Every number here follows from the positions in hand-made-views.toml by the arithmetic
# stated beside it, so it can be recomputed from that file alone. See README.md.
# These numbers are the comparison case. They never enter a proportion table.

[yardstick]
head_height = 480.318  # front view, hair_top to chin; every share below is of this
head_height_three_quarter = 481.4
one_percent = 4.803

# Every left and right landmark of the front view, set against its mirror twin about the centre line.
[front_symmetry]
centre_line_x = 500.0
pairs_checked = 50
largest_sideways_offset = 0.002
largest_level_offset = 0.513
pairs_not_mirrored = ["hair_extent"]

# The turn. A level head turns about an upright axis and is drawn flat, with no perspective.
# Two landmarks that mirror each other across the centre line then stand cos(turn) times as
# far apart as in the front view, whatever their depth. So each pair gives a turn of its own:
# acos(three-quarter spacing / front spacing).
#
# One turn for the whole head is the one that leaves the smallest squared misfit in spacing
# over all the head's pairs: cosine = sum(front * three_quarter) / sum(front * front).
# A pair is every left and right landmark of the head, of kind `node` or `centre`, recorded in
# both views. The pairs left out are listed with the reason, and the shoulders follow separately.
# No pair was dropped for its result.
[turn]
direction = "Toward the viewer's right. The character's right is the near side: her left eye is the narrower one and the nose stands to the viewer's right of the skull's centre."
pairs = 18
cosine = 0.875
degrees = 28.96
lowest_pair_degrees = 0.0
highest_pair_degrees = 32.74
median_pair_degrees = 27.15
# The same fit over only the pairs whose four points are all uncovered in the drawings.
uncovered_pairs = 15
uncovered_cosine = 0.8842
uncovered_degrees = 27.85

[turn.not_counted]
pupil_top = "same sideways position as pupil_centre"
pupil_bottom = "same sideways position as pupil_centre"
lid_line_upper_mid = "same sideways position as lid_line_lower_mid"
eye_opening_centre = "the mean of the two corners of the opening, which are both counted"
neck_base = "the neck is a column: both its edges are silhouettes, and a column's width does not narrow as it turns"

# One entry for each pair of the head. `misfit` is the three-quarter spacing minus the front spacing

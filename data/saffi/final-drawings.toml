# ---------------------------------------------------------------- The two views compared

# Levels. A level head turning about an upright axis keeps every point at its height. So every
# landmark above recorded in both views under one name, except side extents and outline nodes,
# should have one y. Shares are of the S2 front view's head height, as in views-compared.toml.
# These differences are reported and not corrected.
[levels]
head_height = 480.318  # the S2 front view, hair_top to chin
compared = 30
equal = 14
different = 16
above_one_percent = 4

[[levels.difference]]
landmark = "ear_left_base_outer"
front_y = 186.989
three_quarter_y = 167.565
difference = -19.424  # positive is lower in the three-quarter view
percent_of_head_height = 4.04
above_one_percent = true
covered_in = ["three_quarter"]

[[levels.difference]]
landmark = "ear_left_base_inner"
front_y = 155.011

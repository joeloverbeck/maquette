# The list of proportions: every proportion maquette takes from a head or draws one from.
#
# This file is the list. A person reads it here, and the program reads this same file: it is
# built into the binary, `maquette list-proportions` prints it, and a set of proportions is
# checked against it. Nothing else repeats a definition.
#
# It is the first list: what Saffi's front view and three-quarter view need, and how the side
# view is drawn from the same proportions. A convention states the rule that builds it where
# nothing is drawn: the skull's three, since a published drawing shows no skull.
# Each proportion says how it is taken from a side drawing, by the landmarks the reading
# instructions ask a side view for as revision 2026-11-17.4 defines them, or why it is not.
# Revision 2026-11-17.3's definitions were tested once on a drawing whose positions are known:
# Saffi's generated side view, which is a drawing of guides. Revision 2026-11-17.4 added the
# points of the profile at the end of the list, which a set may leave out.

[unit]
name = "eye line to chin"
definition = "The height from the eye line down to the chin. Every proportion is a length divided by it, so the chin is 1 below the eye line."
why = """
A unit has to be a span drawn in every view of every reference, and it must not depend on the hair. \
Eye line to chin is upright, so a level head turned about an upright axis shows it at the same length in the front, \
three-quarter and side views; a sideways span such as the spacing of the eyes narrows with the turn and is gone in a side view. \
Both of its ends are drawn in every view: an eye and the chin. \
Neither end is hair: head height ends at the hair's top, and the skull under the hair is a convention. \
It is the longest such span, so a misplaced point costs it least: brows are often under a fringe, and nose to chin and mouth to chin are shorter. \
In Saffi's hand-made views it is 197.000 units in the front view and 196.973 in the three-quarter view, \
where her head heights differ by 1.082 units."""

[eye_line]
definition = "The level midway between the top and the bottom of the eye opening, averaged over the eyes a view shows."
why = """
The opening is drawn in every view and belongs to the lids, which do not move with the gaze. \
The pupil is the painter's, and the iris is cut by the lid. \
It is not the level line drawn in Saffi's hand-made views: that line stands 4 units higher (0.8% of head height), \
and 0.9% of head height above her pupil centres, on no feature of the eye. The armature draws its eye level line on the eye line."""

[head_height]
definition = "From the hair's top down to the chin: hair_top_rise plus 1, in units. Differences between positions are stated as shares of it. It is not the unit, because it depends on the hair."

[depth]
definition = "How far a point stands in front of the eyes, toward where the face points. Depth zero is the midpoint between the two eye openings' centres; a negative depth is behind it."
why = "Depth needs a zero that is drawn. The eye openings are drawn in every view and do not move with the gaze. The skull's centre, which the head turns about, is a convention and is placed from this zero like everything else."
front = "No depth shows in a front view."
three_quarter = """
A level head turned about an upright axis, drawn flat, shows a point at its front offset times the cosine of the turn \
plus its depth times the sine of the turn. So a left and right pair's midpoint, or a point of the centre line, \
measured sideways from the midpoint of the two eye openings' centres and divided by the sine of the turn, is its depth. \
Depth taken this way at a turn near 30 degrees carries twice the reading error of a position."""
side = """
The side view is the same turn carried to 90 degrees, so it faces the viewer's right: the cosine is 0 and the sine is 1, \
and a point shows at its depth and nothing of its offset. The two points of a left and right pair stand at one place. \
A landmark that a named correction moves shows at its depth less the correction's amount; the corrections are defined at the end of the list. \
The generator draws the side view this way. A depth is taken from a side drawing the same way: how far the drawing shows the point \
toward the front of the face from depth zero, over the side view's own unit. Depth zero shows there midway between the near eye opening's two corners. \
A drawing that faces the viewer's left is mirrored first. \
A side drawing may set the mouth and the chin back as the correction at the end of the list does, and nothing in a reading says by how much: \
a depth taken from it is the depth as that drawing shows it."""

[words]
offset = "A sideways distance from the centre line, in the front view. The head is symmetric: the left and the right point share it."
half_width = "Half of a sideways extent, in the front view."
rise = "A height above the eye line."
drop = "A height below the eye line. A negative drop is above it."
height_in_views = "A height is the same in every view of a level head."
measured = "Taken from features that are drawn."
convention = "Built by a stated rule, because nothing is drawn behind it. A convention is never a measurement and has no valid range."

# Where two views of one head disagree, and what stands in for a point one view does not show.
# These rules are the head model's, and they are applied in this order.
[[disagreement_rule]]
rule = "A height is taken from the three-quarter view. For a left and right pair it is the mean of the two heights there."
[[disagreement_rule]]
rule = "An offset is taken from the three-quarter view when it shows both points of the pair: half their spacing over the cosine of the turn."
[[disagreement_rule]]
rule = "A depth is taken from the three-quarter view: from the pair's midpoint, or, when it shows one point of the pair, from that point and the offset."
[[disagreement_rule]]
rule = "What the three-quarter view does not show is taken from the front view: a point's height, a pair's offset when one of its points is missing, and the half-width of a silhouette."
[[disagreement_rule]]
rule = "The neck and the shoulder line take their widths from the front view. A neck is a column, whose width does not narrow as it turns, and the widest span of the figure is read where nothing foreshortens it."
[[disagreement_rule]]
rule = "The tip of the nose stands at the nose mark's bottom: nose_tip_drop is nose_mark_bottom_drop. Nothing in a front or a three-quarter drawing is read as the tip, so without a side view the two are one point."

# Where a front view is read with a side view of the same character, which is the first route
# to depth. These rules are the head model's too.
[[side_view_rule]]
rule = "Each view is measured in its own unit, from its own eye line down to its own chin. That span is upright, so a level head shows it at the same length from the front and from the side, and it ties the two drawings' sizes together: the two may be drawn at any two sizes, and nothing is compared in pixels across them."
[[side_view_rule]]
rule = "A height is taken from the front view; for a left and right pair it is the mean of the two heights there. An offset and a half-width are taken from the front view: a side view shows none."
[[side_view_rule]]
rule = "A depth is taken from the side view: how far it shows the point toward the front of the face from depth zero, in its own units. Depth zero is midway between the near eye opening's two corners. A side view that faces the viewer's left is mirrored first."
[[side_view_rule]]
rule = "A height the front view does not show is taken from the side view, on the near side. Left out of that are the landmarks the reading instructions define in a side view as other points of the head than in a front view: an ear's two side extents, which in a profile are toward the back and the front of the head; nose-mark-bottom, which in a side view is under the tip of the nose and in a front view the lowest point of the mark as drawn; and the nose mark's corner, which in a side view is the middle of the nostril or of the wing's curve and in a front view the mark's point furthest toward that side. Their depths are the side view's as ever."
[[side_view_rule]]
rule = "The tip of the nose takes its height from the side view: nose_tip_drop is how far below its own eye line the side view places nose-mark-bottom, in its own unit. Its depth is nose_mark_bottom_depth. The nose mark's bottom keeps the front view's height, so a tip's depth is not drawn at the height of the nose's base."
[[side_view_rule]]
rule = "The hair's half-depth is half the distance between its back extent and its front extent, and its centre's depth their midpoint. The neck's depth is the midpoint of the two points where its back and its front end; its width and where it ends are the front view's."
[[side_view_rule]]
rule = "A side view is asked for no temple, no cheek point and no jaw point, so it gives no depth for the face outline's top end, for the cheek points at the eye line, the nose level and the mouth level, or for the jaw point. The skull's rule needs the temple's depth, so the skull is not built from a front view and a side view."

# Guides that are silhouettes or constructions: how each is built in a view from that view's landmarks.
#
# The side view is a plain projection like the others, unless the set of proportions carries
# a named correction: the corrections are defined at the end of this file, and a guide is
# built on its landmarks where the view draws them. It shows fewer guides. The head hides the eye, the brow and the ear of the
# character's left there, so only those of her right, the near side, are drawn; the centre line
# is the front of the face outline and is not drawn a second time; and the neck's two lines
# are its back and its front. Where a plain projection would draw a guide at no width, the
# rule below says what is drawn instead.
[[construction]]
guide = "skull"
rule = "A sphere centred on the upright axis the head turns about, so it is the same circle in every view. A convention: its radius and its centre are stated, not measured. Where a drawing shows a construction circle, as an underdrawing does, the skull is that circle. Where nothing is drawn, as in every published drawing, the skull lies under the hair and is built from features that are drawn: its centre stands at the ears, at the height and the depth of the middle of the ear's base, midway between its two base points, and it reaches the temples, so its radius is the distance in space from that centre to the top end of the face outline. The hair's top is not used, because the hair's thickness varies from work to work. In the side view the circle's point toward the viewer's right is the point where the centre line leaves the skull's surface level with its centre."
[[construction]]
guide = "hair-volume"
rule = "A plain envelope, a convention: a half-ellipse dome from the hair's top down to the height of the skull's centre, then straight sides down to the height of the chin. Seen from above the envelope is an ellipse, so its half-width in a view is the root of (half-width times the cosine of the turn) squared plus (half-depth times the sine of the turn) squared. In the side view that is the hair's half-depth, and the dome stands over the middle of the hair. Behind the head its side runs straight down to the height of the chin. In front it stops where the dome ends, at the height of the skull's centre: a straight side there would run down across the face, and how far the hair comes down over the face is the painter's."
[[construction]]
guide = "face-outline"
rule = "At the top, the eye line, the nose level and the mouth level the head has a cheek point and a jaw-line point on each side, at one half-width and two depths. On each side the outline runs through whichever of the two stands further out in the view, then through the jaw point and the chin: a smooth curve that at each point runs parallel to the line joining its two neighbours. Above the nose level nothing is drawn behind the jaw line, and it keeps its depth at the nose level: a convention. In the side view the outline's front is the centre line: it runs from the skull's front, level with the skull's centre, through the centre line's point at the eye line, the tip of the nose and the mouth line's centre to the chin, and then back and up through the jaw-line points at the mouth level, the nose level, the eye line and the top. Where the set gives the points of the profile, the front runs through the forehead at the brow's height before the eye line, and the centre line's point at the eye line is the bridge of the nose at its own depth; and from the chin the underside of the jaw runs back through the top of the neck's front and then the angle of the jaw before it turns up through the jaw-line points. A point the set leaves out is left out of the outline, which then runs on to the next. At the chin the outline runs level: the chin is its lowest point, where it turns from running down the face to running back under the jaw, and a curve that ran on toward a neck meeting the jaw above the chin's height would sag below it. The jaw point beside the chin belongs to the front of the face and is not on it. Nothing in the list says how far the nose, the lips or the brow stand out from that line, so the side view draws none of them."
[[construction]]
guide = "centre-line"
rule = "From the skull's top it follows the skull's surface forward and down to the eye line: a convention, because nothing is drawn there. Where the set gives the forehead, it runs through it below the skull's front, and where it gives the bridge of the nose, its point at the eye line stands at the bridge's depth and not on the skull. Below the eye line it runs smoothly through the tip of the nose, the mouth line's centre and the chin. In a front view the tip stands straight above the nose mark's bottom, on the same upright line. In the side view it is not drawn: above the skull's front it is the skull's circle, and below it is the front of the face outline."
[[construction]]
guide = "level lines"
rule = "The eye level line is drawn on the eye line, the nose level line midway between the nose mark's corners and its bottom, and the mouth level line at the mouth line's centre. Each spans the face outline at its height. In the side view that is from the jaw-line point at that level to the front of the outline; at the nose level the front is where the outline crosses that height."
[[construction]]
guide = "eye opening, lid line and brow line"
rule = "The opening's top and bottom, the lid line's three points and the brow line's two ends take the depth of the straight line through the eye's two corners at their offset: a convention. The opening is two smooth arcs between its corners, over its top and under its bottom. The lid line is the middle of the drawn lid band, a smooth curve from its inner end over its crest to its outer end. The brow line is the middle of the drawn brow band, a straight line between its two ends. In the side view each is the same construction on the same points at their depths, for the near eye only: the opening is as high as in the front view and as wide as the eye wraps round the face, with the inner corner toward the viewer's right."
[[construction]]
guide = "iris"
rule = "A flat disc facing forward, as drawn, where the lid may already cut it: an ellipse whose width narrows by the cosine of the turn. In the side view the disc is seen edge on and has no width, so it is drawn as an upright line from its top to its bottom, at the iris's depth."
[[construction]]
guide = "nose-mark and mouth-line"
rule = "The nose mark runs straight from one corner through its bottom to the other corner, and the mouth line from one end through its centre to the other end. In the side view the two corners stand at one place and so do the two ends, so each is drawn as its near half: from the near corner to the bottom, and from the near end to the centre. Where a set gives the tip of the nose a height of its own, the nose mark of the three-quarter view and of the side view runs to the tip in place of the bottom, and only the front view's runs to the bottom: the tip is what a turned view shows of the nose, and the base is what a front view marks."
[[construction]]
guide = "ears"
rule = "A flat upright lobe standing on its two base points: the top and the two side extents take the depth of the straight line through the base points at their offset, a convention. The outline is a smooth curve from the outer base point round the outer extent, the top and the inner extent to the inner base point, upright at the extents and level at the top. In the side view it is the same curve through the same points at their depths, for the near ear only: the lobe is seen as far round as its two base points differ in depth, and edge on if they do not."
[[construction]]
guide = "neck"
rule = "An upright round column, as wide in every view. Each of its two lines starts at the lowest point where it crosses the face outline and ends at the neck's base. A line that passes outside the face starts where it crosses the lower half of the skull, and one that misses both starts at the chin's height. In the side view the two lines are the neck's back and its front, and they are named so: left and right in a name are the character's own, and these are neither. Where the set gives a point of the profile at an end of one of them, the top or the base of the neck's front or back, that end of the line is that point, and the column gives only the ends the set leaves out. The neck's depth is then still the column's, which the front and the three-quarter views draw; a side view gives it as the midpoint of the two bases, so a set that gives both bases and another depth draws a side view whose neck stands elsewhere than its column."
[[construction]]
guide = "shoulder-line"
rule = "A straight line between the two shoulder points, which turn with the head. In the side view it is seen end on: the two shoulder points stand at one place, and a line between them has no length. So that it shows, it is drawn as a level tick through that place, half the neck's width to each side: a convention. The tick marks the shoulders' height and depth and says nothing of their width."

# ---------------------------------------------------------------- Hair and skull

[[proportion]]
name = "hair_top_rise"
kind = "measured"
sign = "positive"
what = "How high the hair's top stands above the eye line. With the unit it gives head height."
front = "The eye line's height minus the height of the highest point of the hair."
three_quarter = "The same."
side = "The same."

[[proportion]]
name = "hair_half_width"
kind = "measured"
sign = "positive"
what = "Half the width of the hair at its widest."
front = "Half the distance between the hair's two side extents."
three_quarter = "Not taken: the extents there mix width and depth. See hair_half_depth."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "hair_half_depth"
kind = "measured"
sign = "positive"
what = "Half the depth of the hair from front to back, taking the hair as an ellipse seen from above."
front = "Not seen."
three_quarter = "From half the distance h between the hair's two side extents: the root of (h squared minus (hair_half_width times the cosine of the turn) squared), over the sine of the turn."
side = "Half the distance between the hair's back extent and its front extent, each read at or above the height of the chin."

[[proportion]]
name = "hair_centre_depth"
kind = "measured"
sign = "any"
what = "The depth of the middle of the hair."
front = "Not seen."
three_quarter = "The depth of the midpoint of the hair's two side extents."
side = "The depth of the midpoint of the hair's back extent and its front extent, each read at or above the height of the chin."

[[proportion]]
name = "skull_radius"
kind = "convention"
sign = "positive"
what = "The radius of the skull. Nothing is drawn behind it in a reference, so it is built by rule; where an underdrawing shows a construction circle, it is that circle's."
front = "Where a construction circle is drawn: half the height between its top and bottom."
three_quarter = "The same."
side = "Where a construction circle is drawn: the same. Where none is drawn, the rule cannot build it from a front view and a side view: it needs face_top_depth, which a side view does not give."
rule = "The skull reaches the temples, where the face outline begins. The radius is the distance in space from the skull's centre, built first, to the top end of the face outline: the root of face_top_half_width squared plus (face_top_rise minus skull_centre_rise) squared plus (face_top_depth minus skull_centre_depth) squared. It is a distance in space and not within one view, because the temple stands both to the side of the centre and in front of it."

[[proportion]]
name = "skull_centre_rise"
kind = "convention"
sign = "positive"
what = "How high the skull's centre stands above the eye line."
front = "Where a construction circle is drawn: the eye line's height minus the height of its centre."
three_quarter = "The same."
side = "Where a construction circle is drawn: the same."
rule = "The centre stands at the ears: at the height of the middle of the ear's base, the mean of ear_base_outer_rise and ear_base_inner_rise."

[[proportion]]
name = "skull_centre_depth"
kind = "convention"
sign = "any"
what = "The depth of the skull's centre, and so of the upright axis the head turns about. It is behind the eyes, so it is negative."
front = "Not seen."
three_quarter = "Where a construction circle is drawn: the depth of its centre."
side = "Where a construction circle is drawn: the depth of its centre."
rule = "The centre stands at the ears: at the depth of the middle of the ear's base, the mean of ear_base_outer_depth and ear_base_inner_depth. Drawing lessons put the ear at about the middle of the head's depth."

# ---------------------------------------------------------------- Face outline

[[proportion]]
name = "chin_depth"
kind = "measured"
sign = "any"
what = "The depth of the chin, the lowest point of the face outline. Its height is the unit."
front = "Not seen."
three_quarter = "The depth of the lowest point of the face outline."
side = "The depth of the chin's own lowest point: going down the front of the face, where the outline stops running down and turns to run back under the jaw. It is never a point on the underside of the jaw."

[[proportion]]
name = "face_top_rise"
kind = "measured"
sign = "any"
what = "How high above the eye line the face outline starts, at the temple."
front = "The eye line's height minus the height of the outline's top end, where the hair leaves it showing."
three_quarter = "The same, on the far side."
side_not_taken = "the reading instructions ask a side view for no temple."

[[proportion]]
name = "face_top_half_width"
kind = "measured"
sign = "positive"
what = "Half the width of the face outline at its top end."
front = "Half the distance between the outline's two top ends."
three_quarter = "Not taken: one side only is the same point of the outline."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "face_top_depth"
kind = "measured"
sign = "any"
what = "The depth of the cheek point at the outline's top end: where the front of the face turns into its side."
front = "Not seen."
three_quarter = "From the far side's top end and face_top_half_width."
side_not_taken = "the reading instructions ask a side view for no temple, so a front view and a side view give the temple no depth."

[[proportion]]
name = "face_half_width_at_eye_level"
kind = "measured"
sign = "positive"
what = "Half the width of the face outline at the eye line."
front = "Half the distance between the two points where the outline crosses the eye line."
three_quarter = "Not taken: one side only is the same point of the outline."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "face_depth_at_eye_level"
kind = "measured"
sign = "any"
what = "The depth of the cheek point at the eye line."
front = "Not seen."
three_quarter = "From the point where the far side of the outline crosses the eye line, and face_half_width_at_eye_level."
side_not_taken = "the cheek point is where the front of the face turns into its side. That is the far outline of a three-quarter view and no outline of a profile, so a side view has no point to place there."

[[proportion]]
name = "face_half_width_at_nose_level"
kind = "measured"
sign = "positive"
what = "Half the width of the face outline at the nose level."
front = "Half the distance between the two points where the outline crosses the nose level."
three_quarter = "Not taken: one side only is the same point of the outline."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "face_depth_at_nose_level"
kind = "measured"
sign = "any"
what = "The depth of the cheek point at the nose level."
front = "Not seen."
three_quarter = "From the point where the far side of the outline crosses the nose level, and face_half_width_at_nose_level."
side_not_taken = "the cheek point is where the front of the face turns into its side. That is the far outline of a three-quarter view and no outline of a profile, so a side view has no point to place there."

[[proportion]]
name = "face_half_width_at_mouth_level"
kind = "measured"
sign = "positive"
what = "Half the width of the face outline at the mouth level."
front = "Half the distance between the two points where the outline crosses the mouth level."
three_quarter = "Not taken: one side only is the same point of the outline."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "face_depth_at_mouth_level"
kind = "measured"
sign = "any"
what = "The depth of the cheek point at the mouth level."
front = "Not seen."
three_quarter = "From the point where the far side of the outline crosses the mouth level, and face_half_width_at_mouth_level."
side_not_taken = "the cheek point is where the front of the face turns into its side. That is the far outline of a three-quarter view and no outline of a profile, so a side view has no point to place there."

[[proportion]]
name = "jaw_drop"
kind = "measured"
sign = "positive"
what = "How far below the eye line the jaw point is: the point between the mouth level and the chin where the jaw turns into the chin."
front = "The mean height of the two jaw points minus the eye line's height."
three_quarter = "The same."
side_not_taken = "the reading instructions ask a side view for no jaw point."

[[proportion]]
name = "jaw_half_width"
kind = "measured"
sign = "positive"
what = "The jaw point's offset from the centre line."
front = "Half the spacing of the two jaw points."
three_quarter = "Half the spacing of the two jaw points, over the cosine of the turn."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "jaw_depth"
kind = "measured"
sign = "any"
what = "The depth of the jaw point."
front = "Not seen."
three_quarter = "The depth of the midpoint of the two jaw points."
side_not_taken = "the reading instructions ask a side view for no jaw point. It lies beside the chin on the front of the face, which a profile draws as one line."

[[proportion]]
name = "jaw_line_depth_at_nose_level"
kind = "measured"
sign = "any"
what = "The depth of the jaw-line point at the nose level: the side of the head, which is the outline of the near side in a turned view."
front = "Not seen."
three_quarter = "From the point where the near side of the outline crosses the nose level, and face_half_width_at_nose_level."
side = "The depth of the point where the back edge of the jaw crosses the nose level."

[[proportion]]
name = "jaw_line_depth_at_mouth_level"
kind = "measured"
sign = "any"
what = "The depth of the jaw-line point at the mouth level."
front = "Not seen."
three_quarter = "From the point where the near side of the outline crosses the mouth level, and face_half_width_at_mouth_level."
side = "The depth of the point where the back edge of the jaw crosses the mouth level."

# ---------------------------------------------------------------- Eyes

[[proportion]]
name = "eye_inner_corner_offset"
kind = "measured"
sign = "positive"
what = "The offset of an eye's inner corner: the point of the opening nearest the centre line."
front = "Half the spacing of the two inner corners."
three_quarter = "Half the spacing of the two inner corners, over the cosine of the turn."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "eye_inner_corner_drop"
kind = "measured"
sign = "any"
what = "How far below the eye line the inner corner is."
front = "The mean height of the two inner corners minus the eye line's height."
three_quarter = "The same."
side = "The same, on the near eye."

[[proportion]]
name = "eye_outer_corner_offset"
kind = "measured"
sign = "positive"
what = "The offset of an eye's outer corner: the point of the opening furthest from the centre line."
front = "Half the spacing of the two outer corners."
three_quarter = "Half the spacing of the two outer corners, over the cosine of the turn."
side = "Not seen: a side view shows no width."

[[proportion]]
name = "eye_outer_corner_drop"
kind = "measured"
sign = "any"
what = "How far below the eye line the outer corner is. With the inner corner's drop it gives the opening's tilt."
front = "The mean height of the two outer corners minus the eye line's height."
three_quarter = "The same."
side = "The same, on the near eye."

[[proportion]]
name = "eye_wrap_depth"
kind = "measured"
sign = "any"
what = "How far the inner corners stand in front of the outer corners: how much the eyes wrap round the face. Depth zero is midway, so an inner corner's depth is half of it and an outer corner's is minus half."
front = "Not seen."
three_quarter = "The depth of the midpoint of the two inner corners minus that of the two outer corners."
side = "How far the near eye's inner corner, the one toward the front of the face, stands in front of its outer corner. Depth zero in a side view is midway between the two."

[[proportion]]
name = "eye_opening_height"
kind = "measured"
sign = "positive"
what = "The height of the eye opening from its top to its bottom. The eye line is midway."
front = "The mean over both eyes of the opening's bottom height minus its top height."
three_quarter = "The same."
side = "The same, on the near eye."

[[proportion]]
name = "eye_opening_top_offset"
kind = "measured"

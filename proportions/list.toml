[[proportion]]
name = "ear_inner_extent_rise"
kind = "measured"
sign = "any"
what = "How high above the eye line the ear's inner extent is."
front = "The eye line's height minus the mean height of the two inner extents."
three_quarter = "The same, over the points the head does not cover."

# ---------------------------------------------------------------- Neck and shoulder line

[[proportion]]
name = "neck_half_width"
kind = "measured"
sign = "positive"
what = "Half the width of the neck."
front = "Half the spacing of the two points where the neck ends."
three_quarter = "Not taken: the front view's. A column's width does not narrow as it turns."

[[proportion]]
name = "neck_depth"
kind = "measured"
sign = "any"
what = "The depth of the neck's middle. It is behind the eyes, so it is negative."
front = "Not seen."
three_quarter = "The depth of the midpoint of the two points where the neck ends."

[[proportion]]
name = "neck_base_drop"
kind = "measured"
sign = "positive"
what = "How far below the eye line the neck ends."
front = "The mean height of the two points where the neck ends, minus the eye line's height."
three_quarter = "The same."

[[proportion]]
name = "shoulder_half_width"
kind = "measured"
sign = "positive"
what = "The offset of a shoulder point: half the length of the shoulder line."
front = "Half the spacing of the two shoulder points."
three_quarter = "Not taken: the front view's. The figure turns whole, so the spacing shown is this times twice the cosine of the turn."

[[proportion]]
name = "shoulder_drop"
kind = "measured"
sign = "positive"
what = "How far below the eye line the shoulder points are."
front = "The mean height of the two shoulder points minus the eye line's height."
three_quarter = "The same."

[[proportion]]
name = "shoulder_depth"
kind = "measured"
sign = "any"
what = "The depth of the shoulder points."
front = "Not seen."
three_quarter = "The depth of the midpoint of the two shoulder points."

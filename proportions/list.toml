# ---------------------------------------------------------------- Corrections
#
# A correction is a named departure from flat projection, with an amount. A set of proportions
# carries one in a `[corrections.<name>]` table, with a number for each of its amounts, in
# units. A set without that table carries none, and every view of it is a flat projection.
# The landmark file of a view that a correction changes names it, with its amounts and the
# landmarks it moves, and gives each moved landmark's depth in space beside where it is drawn.

[[correction]]
name = "lower_face_set_back"
view = "side"
what = """
In the side view only, the mouth and the chin are drawn further back than their depths. \
A landmark it moves keeps its depth in space and its height, and stands in the side view at its depth less the amount. \
No landmark above the mouth is moved: the nose mark, the eyes, the brow and the skull stand where a flat projection puts them. \
That holds for landmarks and not for every guide. A guide is built on its landmarks where the view draws them, so the mouth line, the mouth level line and the lower face outline go back with the mouth and the chin. \
The face outline is one smooth curve whose direction at a point follows that point's two neighbours, so it also bends differently on the stretch beyond each moved point, where no landmark moves: \
in front between the eye line and the tip of the nose, and behind between the jaw-line points at the mouth level and at the nose level. \
Two view points read off the outline there shift with it: where the nose level line meets the outline's front, and where the neck's front line starts. \
The front view and the three-quarter view are not changed at all."""
why = """
A depth taken from a three-quarter drawing is a point's sideways shift there over the sine of the turn. \
A three-quarter view drawn by hand commonly puts the mouth almost straight below the nose mark and the chin close behind it, \
which is not where a rigid head turned that far shows them, and at a turn near 30 degrees the shift arrives in the side view doubled: \
the face from the nose down stands out like a muzzle. Jon's look of 2026-11-17 found this in Saffi's side view. \
Her three-quarter view is accepted as it is, so the depths stay as measured and the side view alone departs from them."""
amounts_from = """
No drawing lesson gives a distance for a side view, so each amount comes from where the lessons put the chin and the lips \
(`docs/research/2026-11-16-views-and-measuring/notes/head_construction_in_three_views.md`, section 1, lessons A to H). \
`maquette proportions-from-hand-made-views --lower-face-set-back <share>` works both out from a set's own depths. \
How large a share looks right is Jon's to say: no lesson gives it. For Saffi's set he accepted a share of 0.5 at look 3, on 2026-11-17."""

[[correction.amount]]
name = "chin"
what = "How far behind its depth the side view draws the chin. The jaw point beside the chin, on each side, is drawn back by the same amount."
rule = """
A share, from 0 to 1, of chin_depth minus iris_depth, which is what draws the chin straight below the iris's centre; nothing if the chin is not in front of it. \
Lesson B puts the chin's tip straight below the pupil, and it is the only lesson that places the chin against a point this list has, so a share of 1 is lesson B's chin and nothing supports more. \
The pupil is the painter's and not in this list, so the iris's centre stands for it."""

[[correction.amount]]
name = "mouth"
what = "How far behind its depth the side view draws the mouth line's centre. The mouth line's two ends are drawn back by the same amount."
rule = """
What brings the mouth line's centre onto the straight line from the tip of the nose, which stands at the nose mark's bottom unless the set gives it a height of its own, to the chin as the side view draws it; nothing if it is already on that line or behind it. \
Lessons A, C, F and H put the lips on the line from the nose tip to the chin or just behind it; G draws that line and names a chin that juts as a mistake; B alone lets the lips pass it. \
It follows from the chin's amount, whatever the share, and is not itself a share of anything."""

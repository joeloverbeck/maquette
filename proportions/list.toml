# ---------------------------------------------------------------- The profile, from a side view
#
# Asked of a side view since revision 2026-11-17.4 of the reading instructions. Look 6 drew a
# side view whose forehead, jaw and neck nothing measured: the forehead was the skull's circle,
# the jaw one run from the chin to the jaw line, and the neck the front view's column, and that
# is where it read wrong. A height here is the side view's own, in its own unit, since a front
# view does not show these points. A set may leave each of them out; `when_left_out` says what
# a head drawn from a set that does is drawn with. Where a set gives one, it is a landmark of
# the head, the same point in every view, and the side view draws through it, as the face
# outline's and the neck's constructions say. The forehead stands on the centre line at the
# height of the brow line's inner end, and the neck's four points on the centre line. The angle
# of the jaw is a pair whose offset nothing measures: it stands at the half-width of the face
# outline at the mouth level, a convention, and no guide of a front or a three-quarter view
# runs through it. A set that gives none of them is drawn as before they were asked for.


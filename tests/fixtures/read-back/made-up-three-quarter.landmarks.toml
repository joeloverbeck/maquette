# Test input for tests/read_back.rs: the landmark file of a made-up head, no character's.
#
# `maquette draw --proportions tests/fixtures/made-up-proportions.toml` wrote it on the day the
# recordings beside it were made, and VectorCraft's replies in those recordings are to the SVG
# written with it. It is kept so that the comparison can be tested where VectorCraft is not
# installed. It is no reference for the generator: no test compares what the generator writes
# with this file, and nothing in it is accepted. When the recordings are made again, with
# `maquette read-back-hard-case --record`, this file is replaced with the one drawn then.
# When only the landmark file's own wording changes, it is drawn again from the same set, and
# the SVG drawn with it is checked to be byte for byte the one the recordings are of.
#
# Landmark file of one view of an armature, written by maquette beside the view's SVG.
# Positions are in the SVG's own units: x grows toward the viewer's right, y grows downward.
# Left and right in a name are the character's own.

view = "three-quarter"
svg = "three-quarter.svg"
# How far the head is turned toward the viewer's right, so the character's right is the near side.
turn_degrees = 29.0

[frame]
width = 1000.0
height = 1000.0
unit = 200.0  # eye line to chin: what every proportion is divided by
head_height = 462.54  # hair top to chin: differences are stated as shares of it
eye_line_y = 400.0
turn_axis_x = 500.0  # the upright axis the head turns about, through the skull's centre
turn_axis_depth = -127.5  # the depth that axis stands at: the skull's centre, behind the eyes

# Landmarks: points in space. Every view shows the same landmarks, each at the same height.
# `depth` is how far the point stands in front of the eyes, the same in every view. Depth zero is
# the midpoint between the two eye openings' centres, as the list of proportions defines it.
# x is turn_axis_x plus the front view's offset from its axis times the cosine of the turn,
# plus (depth minus turn_axis_depth) times the sine of the turn.
[landmarks]
chin = { x = 579.994, y = 600.0, depth = 37.5 }
hair-top = { x = 492.844, y = 137.46, depth = -142.26 }

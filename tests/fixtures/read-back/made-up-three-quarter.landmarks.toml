# The SVG's structure: one layer, its children in drawing order, and the guides inside each group.
[structure]
layer = "armature"
children = ["hair-volume", "skull", "face-outline", "centre-line", "eye-level-line", "nose-level-line", "mouth-level-line", "eye-right", "eye-left", "brow-line-right", "brow-line-left", "nose-mark", "mouth-line", "ear-right", "ear-left", "neck", "shoulder-line"]

[structure.groups]
eye-right = ["eye-opening-right", "lid-line-right", "iris-right"]
eye-left = ["eye-opening-left", "lid-line-left", "iris-left"]
neck = ["neck-right", "neck-left"]

# Guides: each is the SVG element whose id is its name. `passes_through` names the landmarks and
# view points its outline passes through, in order; each is one anchor of the element in the SVG.
# A circle or an ellipse passes through its right, bottom, left and top points, not its centre,
# which is how VectorCraft reads one back.

[guides.hair-volume]
element = "path"
closed = false
passes_through = ["hair-right-end", "hair-right-extent", "hair-top", "hair-left-extent", "hair-left-end"]

[guides.skull]
element = "circle"
centre = "skull-centre"
r = 187.58
passes_through = ["skull-left-extent", "skull-bottom", "skull-right-extent", "skull-top"]

[guides.face-outline]
element = "path"
closed = false
passes_through = ["face-outline-left-top", "face-outline-left-at-eye-level", "face-outline-left-at-nose-level", "face-outline-left-at-mouth-level", "face-outline-left-jaw", "chin", "face-outline-right-jaw", "jaw-line-right-at-mouth-level", "jaw-line-right-at-nose-level", "jaw-line-right-at-eye-level", "jaw-line-right-top"]

[guides.centre-line]
element = "path"
closed = false
passes_through = ["skull-top", "skull-front", "centre-line-at-eye-level", "nose-mark-bottom", "mouth-line-centre", "chin"]

[guides.eye-level-line]
element = "line"
passes_through = ["jaw-line-right-at-eye-level", "face-outline-left-at-eye-level"]

[guides.nose-level-line]
element = "line"
passes_through = ["jaw-line-right-at-nose-level", "face-outline-left-at-nose-level"]

[guides.mouth-level-line]
element = "line"
passes_through = ["jaw-line-right-at-mouth-level", "face-outline-left-at-mouth-level"]

[guides.eye-opening-right]
element = "path"
closed = true
passes_through = ["eye-right-outer-corner", "eye-right-opening-top", "eye-right-inner-corner", "eye-right-opening-bottom"]

[guides.lid-line-right]
element = "path"
closed = false
passes_through = ["lid-line-right-inner-end", "lid-line-right-crest", "lid-line-right-outer-end"]

[guides.iris-right]
element = "ellipse"
centre = "iris-right-centre"
rx = 20.807
ry = 21.21
passes_through = ["iris-right-inner-extent", "iris-right-bottom", "iris-right-outer-extent", "iris-right-top"]

[guides.eye-opening-left]
element = "path"
closed = true
passes_through = ["eye-left-outer-corner", "eye-left-opening-top", "eye-left-inner-corner", "eye-left-opening-bottom"]

[guides.lid-line-left]
element = "path"
closed = false
passes_through = ["lid-line-left-inner-end", "lid-line-left-crest", "lid-line-left-outer-end"]

[guides.iris-left]
element = "ellipse"
centre = "iris-left-centre"
rx = 20.807
ry = 21.21
passes_through = ["iris-left-outer-extent", "iris-left-bottom", "iris-left-inner-extent", "iris-left-top"]

[guides.brow-line-right]
element = "line"
passes_through = ["brow-line-right-inner-end", "brow-line-right-outer-end"]

[guides.brow-line-left]
element = "line"
passes_through = ["brow-line-left-inner-end", "brow-line-left-outer-end"]

[guides.nose-mark]
element = "polyline"
passes_through = ["nose-mark-right-corner", "nose-mark-bottom", "nose-mark-left-corner"]

[guides.mouth-line]
element = "polyline"
passes_through = ["mouth-line-right-end", "mouth-line-centre", "mouth-line-left-end"]

[guides.ear-right]
element = "path"
closed = false
passes_through = ["ear-right-base-outer", "ear-right-outer-extent", "ear-right-top", "ear-right-inner-extent", "ear-right-base-inner"]

[guides.ear-left]
element = "path"
closed = false
passes_through = ["ear-left-base-outer", "ear-left-outer-extent", "ear-left-top", "ear-left-inner-extent", "ear-left-base-inner"]

[guides.neck-right]
element = "line"
passes_through = ["neck-right-top", "neck-right-base"]

[guides.neck-left]
element = "line"
passes_through = ["neck-left-top", "neck-left-base"]

[guides.shoulder-line]
element = "line"
passes_through = ["shoulder-right-point", "shoulder-left-point"]

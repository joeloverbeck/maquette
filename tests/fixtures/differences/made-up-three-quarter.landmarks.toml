# A made-up landmark file of a three-quarter view, for the tests in tests/differences.rs.
#
# It was typed by hand, not written by the generator, and every number was invented so that
# the differences from made-up-hand-made-views.toml can be worked out by hand. It holds only
# what the comparison reads: the view, the frame and the positions.
#
# It is drawn at the record's size but in another place. Laid over the record (unit 200,
# eye line 300, axis 495), a position x, y of this file stands at x + 15, y - 10.

view = "three-quarter"
svg = "made-up-three-quarter.svg"
turn_degrees = 29.0

[frame]
width = 1000.0
height = 1000.0
unit = 200.0
head_height = 400.0
eye_line_y = 310.0
turn_axis_x = 480.0

[landmarks]
chin = { x = 555.0, y = 510.0, depth = 0.0 }
hair-top = { x = 475.0, y = 108.0, depth = 0.0 }
skull-centre = { x = 480.0, y = 260.0, depth = 0.0 }
eye-right-opening-top = { x = 465.0, y = 300.0, depth = 0.0 }
eye-right-opening-bottom = { x = 465.0, y = 320.0, depth = 0.0 }
# Laid over at 560, 384.012: 4.012 units from the record's 560, 380. That is 1.003% of the
# front view's head height of 400, and it would be 0.998% of this view's own 402.
nose-mark-bottom = { x = 545.0, y = 394.012, depth = 0.0 }
# Laid over at 400, 380, on the record's near-side outline at the nose level: no difference.
jaw-line-right-at-nose-level = { x = 385.0, y = 390.0, depth = 0.0 }
# Laid over at 445, 380. It is not what the record's near-side outline is compared with:
# that would show 45 units, 11.25%.
face-outline-right-at-nose-level = { x = 430.0, y = 390.0, depth = 0.0 }
# Laid over at 600, 311: 6 units below the middle of the record's lid band at 600, 305. 1.5%.
lid-line-left-inner-end = { x = 585.0, y = 321.0, depth = 0.0 }
# Laid over at 640, 188: 8 units below the record's 640, 180, which the head covers in the
# drawing. 2%. It is compared all the same, and marked as covered.
ear-left-base-outer = { x = 625.0, y = 198.0, depth = 0.0 }

[view_points]

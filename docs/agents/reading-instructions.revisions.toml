# Every revision of `reading-instructions.md` that readers have been given, and the SHA-256
# digest of the file at that revision. A reading names the revision it was made under, so the
# text of a revision never changes: a change to the file is a new revision, on its own
# `Revision:` line, with a new entry here. `tests/reading_instructions_revision.rs` fails when
# the file's revision has no entry, or its entry is not the file's digest.

# The SVG's structure: one layer, its children in drawing order, and the guides inside each group.
[structure]
layer = "armature"
children = ["hair-volume", "skull", "face-outline", "eye-level-line", "nose-level-line", "mouth-level-line", "eye-right", "brow-line-right", "nose-mark", "mouth-line", "ear-right", "neck", "shoulder-line"]

[structure.groups]
eye-right = ["eye-opening-right", "lid-line-right", "iris-right"]
neck = ["neck-back", "neck-front"]

# Guides: each is the SVG element whose id is its name. `passes_through` names the landmarks and
# view points its outline passes through, in order; each is one anchor of the element in the SVG.
# A circle or an ellipse passes through its right, bottom, left and top points, not its centre,
# which is how VectorCraft reads one back.

[guides.hair-volume]
element = "path"
closed = false
passes_through = ["hair-back-end", "hair-back-extent", "hair-top", "hair-front-extent"]

[guides.skull]
element = "circle"
centre = "skull-centre"
r = 196.694
passes_through = ["skull-front", "skull-bottom", "skull-back", "skull-top"]

[guides.face-outline]
element = "path"
closed = false
passes_through = ["skull-front", "centre-line-at-eye-level", "nose-mark-bottom", "mouth-line-centre", "chin", "jaw-line-right-at-mouth-level", "jaw-line-right-at-nose-level", "jaw-line-right-at-eye-level", "jaw-line-right-top"]

[guides.eye-level-line]
element = "line"
passes_through = ["jaw-line-right-at-eye-level", "centre-line-at-eye-level"]

[guides.nose-level-line]
element = "line"
passes_through = ["jaw-line-right-at-nose-level", "face-outline-front-at-nose-level"]

[guides.mouth-level-line]
element = "line"
passes_through = ["jaw-line-right-at-mouth-level", "mouth-line-centre"]

[guides.eye-opening-right]
element = "path"
closed = true
passes_through = ["eye-right-outer-corner", "eye-right-opening-top", "eye-right-inner-corner", "eye-right-opening-bottom"]

[guides.lid-line-right]
element = "path"
closed = false
passes_through = ["lid-line-right-inner-end", "lid-line-right-crest", "lid-line-right-outer-end"]

[guides.iris-right]
element = "line"
passes_through = ["iris-right-top", "iris-right-bottom"]

[guides.brow-line-right]
element = "line"
passes_through = ["brow-line-right-inner-end", "brow-line-right-outer-end"]

[guides.nose-mark]
element = "line"
passes_through = ["nose-mark-right-corner", "nose-mark-bottom"]

[guides.mouth-line]
element = "line"
passes_through = ["mouth-line-right-end", "mouth-line-centre"]

[guides.ear-right]
element = "path"
closed = false
passes_through = ["ear-right-base-outer", "ear-right-outer-extent", "ear-right-top", "ear-right-inner-extent", "ear-right-base-inner"]

[guides.neck-back]
element = "line"
passes_through = ["neck-back-top", "neck-back-base"]

[guides.neck-front]
element = "line"
passes_through = ["neck-front-top", "neck-front-base"]

[guides.shoulder-line]
element = "line"
passes_through = ["shoulder-line-back-end", "shoulder-line-front-end"]

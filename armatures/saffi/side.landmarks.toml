# Corrections: the named departures from flat projection that this view carries. The list of
# proportions defines each (`maquette list-proportions`). `amount` is how far behind its depth, toward
# the viewer's left, this view draws each landmark named, in the SVG's own units. No other view of
# this armature is changed.
[corrections.lower_face_set_back]
chin = { amount = 20.864, landmarks = ["chin", "face-outline-right-jaw", "face-outline-left-jaw"] }
mouth = { amount = 18.166, landmarks = ["mouth-line-centre", "mouth-line-right-end", "mouth-line-left-end"] }

# View points: points of this view only, such as the side of a round form or where two guides cross.
# Under the same name another view shows a different point of the head.
[view_points]
hair-back-end = { x = 258.746, y = 600.0 }
hair-back-extent = { x = 258.746, y = 327.299 }
hair-front-extent = { x = 701.68, y = 327.299 }

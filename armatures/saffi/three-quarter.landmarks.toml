# Landmark file of one view of an armature, written by maquette beside the view's SVG.
# Positions are in the SVG's own units: x grows toward the viewer's right, y grows downward.
# Left and right in a name are the character's own.

view = "three-quarter"
svg = "three-quarter.svg"
# How far the head is turned toward the viewer's right, so the character's right is the near side.
turn_degrees = 29.0

[frame]
width = 1000.0
height = 1000.0
unit = 200.0  # eye line to chin: what every proportion is divided by
head_height = 494.456  # hair top to chin: differences are stated as shares of it
eye_line_y = 400.0
turn_axis_x = 500.0  # the upright axis the head turns about, through the skull's centre
turn_axis_depth = -138.398  # the depth that axis stands at: the skull's centre, behind the eyes

# Landmarks: points in space. Every view shows the same landmarks, each at the same height.
# `depth` is how far the point stands in front of the eyes, the same in every view. Depth zero is
# the midpoint between the two eye openings' centres, as the list of proportions defines it.
# x is turn_axis_x plus the front view's offset from its axis times the cosine of the turn,
# plus (depth minus turn_axis_depth) times the sine of the turn.
[landmarks]
chin = { x = 583.197, y = 600.0, depth = 33.209 }
hair-top = { x = 490.407, y = 105.544, depth = -158.185 }
skull-centre = { x = 500.0, y = 327.299, depth = -138.398 }

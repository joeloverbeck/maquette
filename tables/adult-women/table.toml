# A proportion table, by `maquette table-from-readings`: for each proportion of the list, the
# number of works whose accepted readings give it and, where five or more do, the lowest, the
# middle and the highest value among them. `maquette list-proportions` defines each proportion.
#
# It is a proposal until Jon has accepted it. [rules] says what it is built from, when a
# proportion has a valid range, and what the table does not say.

[table]
built_from = "the record of Jon's check at Look 4 of 8, checked on 2026-11-17"
works = 6
works_for_a_table = 5
proportions = 74
given = 25
too_thin = 27
no_work = 19
conventions = 3

[rules]
built_from = "A table is built from the record of Jon's check and from nothing else: the readings of each character he accepted, each drawing as the record rules it, with what he marked as off left out. A drawing that is set aside or not called level is left out, and so is a character he rejected."
a_work = "Each accepted character is one work, and a table counts works. Heights and widths are taken from a work's front view, so a work with no measured front view gives nothing. Depth is taken from its side view where one is measured, and otherwise from its three-quarter view at the turn the readings show."
values = "For each proportion: the number of works that give it and, where it has a range, the lowest, the middle and the highest value among them. The middle is the median: the middle value in order, or midway between the two middle values of an even number of works. Every value is in units, a length over the height from the eye line down to the chin."
floor = "A proportion with five works or more behind it is given: its valid range runs from its lowest value to its highest. A proportion with fewer is too thin: the table says how many works stand behind it and why the others do not give it, and states no number, because the values of one to four works are those works' own numbers. It has no range, and nothing is set against it. The floor is held proportion by proportion. In a view that has five works, a proportion that hair or a mark of Jon's leaves with fewer is too thin all the same: the floor is there so that no range is one hand's habit, and a range is backed only by the works that show that feature. A view with fewer than five works is reported as too thin and is not a table."
conventions = "A convention is built by a stated rule and is never a measurement: it has no valid range, however many works the rule could be run on, and the table states no number for it."
separate_ranges = "Each range is separate. The table does not rule on which combinations of proportions go together: a head with every proportion inside its range may still be one that no reference shows."
single_references = "A lowest value and a highest value are each one reference's number. The table does not tie them to a work."
comparison_case = "No comparison case's numbers are in a table. The command that builds one takes the record of Jon's check and no set of proportions, reads only from the reference folder, and refuses what is not a reader's reading of a drawing."


# A proportion table, by `maquette table-from-readings`: for each proportion of the list, the
# number of characters whose accepted readings give it, the works they come from and, where
# five or more characters do, the lowest, the middle and the highest value among them.
# `maquette list-proportions` defines each proportion.
#
# It is a proposal until Jon has accepted it. [rules] says what it is built from, what it
# counts, when a proportion has a valid range, and what the table does not say.

[table]
built_from = "the records of Jon's checks at Look 4 of 8, checked on 2026-11-17, and at Look 7 of 8, checked on 2026-11-18"
characters = 20
works = 12
characters_for_a_table = 5
proportions = 86
given = 56
too_thin = 20
no_character = 7
conventions = 3
# Accepted and not measured. `maquette jons-check` says why.
left_out = [
  "the side view of `work-3` is not measured by the record of Jon's check at Look 7 of 8, checked on 2026-11-18, and another record's readings of it are",
  "`character-2` has no measured front view, and heights and widths are the front view's: nothing is taken from it",
  "the three-quarter view of `character-6` is not used: its depth is taken from its side view",
  "the three-quarter view of `character-7` is not used: its depth is taken from its side view",
  "the three-quarter view of `character-14` is not used: its depth is taken from its side view",
]
bands = [{ band = "adult", characters = 14 }, { band = "teenage", characters = 6 }]

[rules]
built_from = "A table is built from the records of Jon's checks and from nothing else: the readings of each character he accepted, each drawing as its record rules it, with what he marked as off left out. A drawing that is set aside or not called level is left out, and so is a character he rejected. A record names its readings from the folder it is in, so the records of several batches, each in its own folder, can build one table."
read_again = "A label that several records name is one character, and its readings must say the same reference in each; a character accepted in one record and rejected in another builds no table. One drawing may be read again under a later revision of the reading instructions, which asks for points the earlier did not: the earlier readings, which Jon accepted first, give every proportion they give, and the later ones only what the earlier were not asked for. Two measured drawings of a view that are two pictures, or one picture read twice under one revision, build no table."
a_character = "A table counts characters: one drawing of each accepted character in each view. Heights and widths are taken from a character's front view, so a character with no measured front view gives nothing. Depth is taken from its side view where one is measured, and otherwise from its three-quarter view at the turn the readings show."
works = "Beside each count of characters stands the number of works they come from, and how many of them the work that gives the most gives, so that a range resting on one hand can be seen: several characters of one work's sheets are drawn by one hand or a few. A work is what the characters' readings name as their work, word for word, with its designer where it is known. Characters whose work is not known are counted under the words their readings give, so they may join drawings by different hands, or part drawings by one."
values = "For each proportion: the number of characters that give it and, where it has a range, the lowest, the middle and the highest value among them. The middle is the median: the middle value in order, or midway between the two middle values of an even number of characters. Every value is in units, a length over the height from the eye line down to the chin."
floor = "A proportion with five characters or more behind it is given: its valid range runs from its lowest value to its highest. A proportion with fewer is too thin: the table says how many characters stand behind it and why the others do not give it, and states no number, because the values of one to four characters are those characters' own numbers. It has no range, and nothing is set against it. The floor is held proportion by proportion. In a view that has five characters, a proportion that hair or a mark of Jon's leaves with fewer is too thin all the same, because a range is backed only by the characters that show that feature. A view with fewer than five characters is reported as too thin and is not a table. The floor counts characters and not works; how many works stand behind a range is stated beside it, and is not a floor."
age_bands = "Where the characters are of more than one age band, as their readings give it, each proportion also states each band's own count of characters and, where five or more of a band give it, that band's own lowest, middle and highest value, with whether the ranges of every two bands overlap. The table's own range is of every character, whatever its band. Where the ranges overlap, that proportion does not tell the bands apart on the characters measured, and where they do not, it does. Neither tests whether the bands differ beyond those characters: ranges that overlap may still be of bands that differ, and ranges that do not may rest on few characters of few works."
conventions = "A convention is built by a stated rule and is never a measurement: it has no valid range, however many characters the rule could be run on, and the table states no number for it."
separate_ranges = "Each range is separate. The table does not rule on which combinations of proportions go together: a head with every proportion inside its range may still be one that no reference shows."
single_references = "A lowest value and a highest value are each one reference's number. The table does not tie them to a work."
comparison_case = "No comparison case's numbers are in a table. The command that builds one takes the record of Jon's check and no set of proportions, reads only from the reference folder, and refuses what is not a reader's reading of a drawing."

